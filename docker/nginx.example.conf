# Example reverse-proxy configuration for EdgeAfterCosts.
#
# This is a template, not a deployment. It assumes:
#   * nginx and the EdgeAfterCosts containers can reach each other by container
#     name (put nginx on the `edge-after-costs-internal` network, or replace
#     the upstream names with host:port pairs);
#   * TLS is terminated here;
#   * the application is served under the path prefix configured as BASE_PATH
#     (default `/edge-after-costs`). If you change BASE_PATH, change `basePath`
#     and `assetPrefix` in web/next.config.mjs to match, and update the two
#     `location` prefixes below.
#
# Serving at the domain root instead: set BASE_PATH="", remove basePath and
# assetPrefix from web/next.config.mjs, and use `location /api/` and
# `location /` below.

server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.example;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;

    # The API must be matched before the UI: the longer prefix has to win.
    location /edge-after-costs/api/ {
        proxy_pass http://edge-after-costs-api:8000;   # path preserved deliberately
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /edge-after-costs {
        proxy_pass http://edge-after-costs-web:3000;   # Next.js basePath=/edge-after-costs
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

server {
    listen 80;
    server_name your-domain.example;
    return 301 https://$host$request_uri;
}
