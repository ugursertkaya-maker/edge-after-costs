# EdgeAfterCosts — PAPER ONLY. Self-contained stack.
#
# `docker compose up --build` brings up the whole system with no external
# dependency beyond a container runtime:
#   * its own bridge network `edge-after-costs-internal`; db and redis are never
#     published to the host
#   * its own Postgres, Redis and volumes — nothing is shared with anything
#     else running on the machine
#   * a single published port: 127.0.0.1:3000 -> web
#   * memory/CPU limits sized for a small 2-core machine. Raise them if you
#     have the headroom; nothing here depends on the specific values.
#
# To put this behind a TLS-terminating reverse proxy, see
# docker/nginx.example.conf.
name: edge-after-costs

x-restart: &restart
  restart: unless-stopped
x-logging: &logging
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

services:
  db:
    <<: [*restart, *logging]
    image: postgres:16-alpine
    container_name: edge-after-costs-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edge_after_costs}
      POSTGRES_USER: ${POSTGRES_USER:-edge_after_costs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes: [edge-after-costs-pgdata:/var/lib/postgresql/data]
    networks: [edge-after-costs-internal]
    mem_limit: 448m
    cpus: 0.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edge_after_costs} -d ${POSTGRES_DB:-edge_after_costs}"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  redis:
    <<: [*restart, *logging]
    image: redis:7-alpine
    container_name: edge-after-costs-redis
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [edge-after-costs-internal]
    mem_limit: 96m
    cpus: 0.15
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 6

  api:
    <<: [*restart, *logging]
    build: { context: ./api }
    image: edge-after-costs-api:latest
    container_name: edge-after-costs-api
    env_file: [.env]
    environment:
      POSTGRES_HOST: edge-after-costs-db
      REDIS_HOST: edge-after-costs-redis
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [edge-after-costs-internal]
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/edge-after-costs/api/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 40s

  worker:
    <<: [*restart, *logging]
    image: edge-after-costs-api:latest
    container_name: edge-after-costs-worker
    entrypoint: []
    command: ["python", "-m", "app.worker.main"]
    env_file: [.env]
    environment:
      POSTGRES_HOST: edge-after-costs-db
      REDIS_HOST: edge-after-costs-redis
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_healthy }
    volumes:
      - edge-after-costs-cache:/data/backtest-cache
      - edge-after-costs-tape:/data/tape
      - edge-after-costs-research:/data/research
    networks: [edge-after-costs-internal]   # outbound only, nothing inbound
    mem_limit: 640m
    cpus: 0.8
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis,os,sys,time;r=redis.Redis(host='edge-after-costs-redis',decode_responses=True);b=r.get('edge_after_costs:worker:heartbeat');sys.exit(0 if b and (time.time()*1000-int(b))<60000 else 1)\""]
      interval: 30s
      timeout: 8s
      retries: 4
      start_period: 90s

  web:
    <<: [*restart, *logging]
    build: { context: ./web }
    image: edge-after-costs-web:latest
    container_name: edge-after-costs-web
    environment:
      API_ORIGIN: http://edge-after-costs-api:8000
      NODE_ENV: production
    depends_on:
      api: { condition: service_started }
    # Loopback only by default. Change to "3000:3000" to expose it on the LAN,
    # or drop the mapping entirely and reach it through a reverse proxy.
    ports: ["127.0.0.1:3000:3000"]
    networks: [edge-after-costs-internal]
    mem_limit: 256m
    cpus: 0.35
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/edge-after-costs/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 25s

networks:
  edge-after-costs-internal: { name: edge-after-costs-internal, driver: bridge }

volumes:
  edge-after-costs-pgdata: { name: edge-after-costs-pgdata }
  edge-after-costs-cache: { name: edge-after-costs-cache }
  edge-after-costs-tape: { name: edge-after-costs-tape }
  edge-after-costs-research: { name: edge-after-costs-research }
