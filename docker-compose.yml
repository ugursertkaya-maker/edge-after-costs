# NetEdge — PAPER ONLY. Self-contained stack.
#
# `docker compose up --build` brings up the whole system with no external
# dependency beyond a container runtime:
#   * its own bridge network `netedge-internal`; db and redis are never
#     published to the host
#   * its own Postgres, Redis and volumes — nothing is shared with anything
#     else running on the machine
#   * a single published port: 127.0.0.1:3000 -> web
#   * memory/CPU limits sized for a small 2-core machine. Raise them if you
#     have the headroom; nothing here depends on the specific values.
#
# To put this behind a TLS-terminating reverse proxy, see
# docker/nginx.example.conf.
name: netedge

x-restart: &restart
  restart: unless-stopped
x-logging: &logging
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

services:
  db:
    <<: [*restart, *logging]
    image: postgres:16-alpine
    container_name: netedge-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netedge}
      POSTGRES_USER: ${POSTGRES_USER:-netedge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes: [netedge-pgdata:/var/lib/postgresql/data]
    networks: [netedge-internal]
    mem_limit: 448m
    cpus: 0.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netedge} -d ${POSTGRES_DB:-netedge}"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  redis:
    <<: [*restart, *logging]
    image: redis:7-alpine
    container_name: netedge-redis
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [netedge-internal]
    mem_limit: 96m
    cpus: 0.15
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 6

  api:
    <<: [*restart, *logging]
    build: { context: ./api }
    image: netedge-api:latest
    container_name: netedge-api
    env_file: [.env]
    environment:
      POSTGRES_HOST: netedge-db
      REDIS_HOST: netedge-redis
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [netedge-internal]
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/netedge/api/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 40s

  worker:
    <<: [*restart, *logging]
    image: netedge-api:latest
    container_name: netedge-worker
    entrypoint: []
    command: ["python", "-m", "app.worker.main"]
    env_file: [.env]
    environment:
      POSTGRES_HOST: netedge-db
      REDIS_HOST: netedge-redis
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_healthy }
    volumes:
      - netedge-cache:/data/backtest-cache
      - netedge-tape:/data/tape
      - netedge-research:/data/research
    networks: [netedge-internal]   # outbound only, nothing inbound
    mem_limit: 640m
    cpus: 0.8
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis,os,sys,time;r=redis.Redis(host='netedge-redis',decode_responses=True);b=r.get('netedge:worker:heartbeat');sys.exit(0 if b and (time.time()*1000-int(b))<60000 else 1)\""]
      interval: 30s
      timeout: 8s
      retries: 4
      start_period: 90s

  web:
    <<: [*restart, *logging]
    build: { context: ./web }
    image: netedge-web:latest
    container_name: netedge-web
    environment:
      API_ORIGIN: http://netedge-api:8000
      NODE_ENV: production
    depends_on:
      api: { condition: service_started }
    # Loopback only by default. Change to "3000:3000" to expose it on the LAN,
    # or drop the mapping entirely and reach it through a reverse proxy.
    ports: ["127.0.0.1:3000:3000"]
    networks: [netedge-internal]
    mem_limit: 256m
    cpus: 0.35
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/netedge/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 25s

networks:
  netedge-internal: { name: netedge-internal, driver: bridge }

volumes:
  netedge-pgdata: { name: netedge-pgdata }
  netedge-cache: { name: netedge-cache }
  netedge-tape: { name: netedge-tape }
  netedge-research: { name: netedge-research }
